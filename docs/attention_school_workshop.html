<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>From Vectors to Attention • School Workshop</title><style>
:root{--bg:#f5f6fa;--ink:#17213a;--muted:#526079;--blue:#3157d5;--line:#dce1ed;--green:#087c69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 system-ui,sans-serif}header{background:#17213a;color:white;padding:22px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{font-size:22px}header small{display:block;color:#bbc8e9}button,select,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:9px 15px}button:hover,button:focus-visible{border-color:var(--blue);color:var(--blue)}header button{font-size:15px}nav{display:flex;flex-wrap:wrap;gap:7px;padding:18px 5%;border-bottom:1px solid var(--line)}nav button{font-size:14px}nav button.active{background:var(--blue);color:white;border-color:var(--blue)}main{max-width:1120px;margin:auto;padding:25px 30px 50px}.eyebrow{color:var(--blue);font-weight:750;letter-spacing:2px;font-size:13px;text-transform:uppercase}h1{font-size:42px;line-height:1.15;letter-spacing:-1px;margin:12px 0 20px}h2{font-size:24px;line-height:1.3}p{margin:12px 0}.lead{font-size:21px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin:18px 0}.callout{border-left:4px solid var(--blue);padding:14px 20px;background:#eaf0ff;border-radius:4px;margin:20px 0}.note{font-size:15px;color:var(--muted)}.formula{font:24px/1.5 ui-monospace,monospace;color:var(--blue);overflow-wrap:anywhere}.result{font-size:29px;font-weight:750;color:var(--green)}table{border-collapse:collapse;width:100%;margin:14px 0;font-size:17px}th,td{border-bottom:1px solid var(--line);padding:10px;text-align:left}th{color:var(--muted);font-size:14px}pre{white-space:pre-wrap;background:#17213a;color:#e7edff;padding:20px;border-radius:12px;font:14px/1.65 ui-monospace,monospace;overflow-wrap:anywhere}.vector input{width:76px;padding:7px;border:1px solid var(--line);border-radius:7px;margin:4px}svg{width:100%;max-height:260px}label{display:inline-block;margin:8px 12px 8px 0}input[type=range]{max-width:250px;vertical-align:middle}.pager{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:20px}.pager span{font-size:14px;color:var(--muted)}details{margin:15px 0}summary{cursor:pointer;color:var(--blue);font-weight:650}.chips{display:flex;flex-wrap:wrap;gap:12px}.chips div{background:#eef1fa;padding:12px;border-radius:8px;flex:1;min-width:170px}.scorecell{width:100%;border:none;background:#eef2ff;font-weight:650}.scorecell.selected{background:var(--blue);color:white}.hidden{display:none}.question{border-bottom:1px solid var(--line);padding:14px 0}.question button{display:block;text-align:left;width:100%;margin:7px 0;font-size:16px}.feedback{color:var(--green);font-size:16px}.present nav{display:none}.present main{max-width:1300px}.present{font-size:21px}.present h1{font-size:48px}.present .note{font-size:17px}footer{font-size:13px;color:var(--muted);margin-top:30px}@media(max-width:720px){.grid{grid-template-columns:1fr}h1{font-size:32px}main{padding:20px 16px}header{flex-wrap:wrap}table{font-size:14px}th,td{padding:6px}}@media print{nav,header button,.pager,button{display:none}body{background:white;font-size:12pt}.slide{display:block!important;break-after:page}.card{break-inside:avoid}main{padding:0}h1{font-size:26pt}pre{background:#eee;color:#111}header{background:white;color:#111}footer{display:none}}
</style></head><body><header><div><strong>From Vectors to Attention</strong><small>A school-based workshop • Foundations through Q, K & V</small></div><div><button id="present">Presentation mode</button> <button id="full">Fullscreen</button> <button onclick="window.print()">Print current lesson</button></div></header><nav id="nav" aria-label="Lessons"></nav><main id="main"></main><script>
const titles=['Learning map','School document & embeddings','Dot product','Cosine & normalization','Matrix shapes','Score matrix explorer','Creating Q: recipes','Creating K & scores','Creating V & context','Retrieval vs attention','Knowledge check'];
const slides=[
`<div class="eyebrow">Team workshop</div><h1>Small numbers.<br>Real understanding.</h1><p class="lead">Learn how numerical vectors become contextual information inside a transformer.</p><div class="grid"><div class="card"><h2>Our school scenario</h2><p>A parent asks: <strong>“When do classes begin?”</strong></p><p>The school document says: <strong>“Classes begin at 8:30 AM.”</strong></p><p>We’ll distinguish finding this text from processing it inside the model.</p></div><div class="card"><h2>What we have covered</h2><ol><li>Vectors, dot product and cosine similarity</li><li>Normalization and embedding dimensions</li><li>Matrices, transpose and score generation</li><li>Learned transformations: Q, K and V</li><li>Weighted value combinations</li></ol></div></div><div class="callout">Use the lesson tabs or ← / → keys. Editable examples recalculate instantly. All features work offline; no packages or model downloads required.</div><p class="note">Toy vectors and weights demonstrate arithmetic. They are not actual learned embeddings. Scaling, softmax, masking and multi-head attention are upcoming lessons, not implemented here.</p>`,
`<div class="eyebrow">01 • Retrieval foundations</div><h1>Chunks become fixed-size embeddings</h1><div class="grid"><div class="card"><h2>Your school document</h2><pre>School Fees\nSchool fees must be paid by 10 June.\nParents can pay through the school portal.\n\nSchool Timings\nClasses begin at 8:30 AM and end at 2:30 PM.\nStudents should arrive ten minutes before classes begin.\n\nSchool Uniform\nStudents must wear the prescribed uniform.\nSports uniform is required on Wednesdays.</pre></div><div class="card"><h2>Select an embedding model</h2><select id="model"><option value="384">all-MiniLM-L6-v2 • 384</option><option value="768">all-mpnet-base-v2 • 768</option></select><div id="emb"></div><p class="note">This demonstrates shapes only. It does not run an embedding model or generate real vectors.</p></div></div><div class="callout">Chunking chooses which text belongs together. The embedding model determines how many numbers represent each chunk.</div><details><summary>How a chunk becomes one vector</summary><p>Tokenizer → token representations → transformer contextual representations → pooling → one chunk embedding. These models use mean pooling over valid token positions. Normalization may follow.</p><p>More text changes the token count and vector values, not the final dimension. Text beyond the model’s input limit can be truncated.</p></details><pre>model = SentenceTransformer("sentence-transformers/all-MiniLM-L6-v2")\nvector = model.encode(chunk)\nprint(vector.shape)  # (384,)</pre><p class="note">A vector(384) database column requires exactly 384 entries per row. It can hold many rows. Changing models requires re-embedding documents and questions; keep different models in separate collections, even if their dimensions match.</p>`,
`<div class="eyebrow">02 • Arithmetic</div><h1>Dot product: multiply, then add</h1><p class="lead">Two vectors of equal length produce one scalar score.</p><div class="grid"><div class="card"><label>Vector A</label><div class="vector" id="avec"></div><label>Vector B</label><div class="vector" id="bvec"></div><div id="dot"></div></div><div class="card"><h2>School interpretation</h2><p>In retrieval, a question embedding can be compared with a school chunk embedding.</p><p>Inside attention, a token’s query is compared with another token’s key.</p><div class="callout">The arithmetic is the same; the vectors’ roles are different.</div><p class="note">A larger raw dot product can reflect greater magnitude, greater alignment, or both. It is not a probability.</p></div></div><pre>def dot_product(a, b):\n    if len(a) != len(b):\n        raise ValueError("Dimensions must match")\n    return sum(x * y for x, y in zip(a, b))</pre>`,
`<div class="eyebrow">03 • Direction vs length</div><h1>Normalize to compare direction</h1><p>Keep A = [1, 1]. Adjust the length of B without changing B’s direction.</p><div class="card"><label>B multiplier: <input id="scale" type="range" min="1" max="20" value="10"></label><label>B direction: <select id="direction"><option value="same">[1, 1] • same direction</option><option value="partial">[1, 0] • partly aligned</option><option value="opposite">[-1, -1] • opposite direction</option></select></label><div id="cos"></div></div><div class="grid"><div class="card"><div class="formula">‖v‖ = √(v₁² + v₂² + …)</div><div class="formula">normalized(v) = v / ‖v‖</div><p>Divide every entry by the magnitude. A nonzero vector becomes length 1 without changing its direction.</p></div><div class="card"><div class="formula">cosine(a,b) = (a · b) / (‖a‖ ‖b‖)</div><p>Equivalently: dot product of normalized vectors.</p><p>1 = same direction; 0 = perpendicular; −1 = opposite. A score of 0.8 is not “80% similar.”</p></div></div><div class="callout">School retrieval example: cosine removes a longer chunk vector’s magnitude advantage when directional comparison is intended. Use the similarity measure appropriate to the embedding model.</div><p class="note">Zero vectors cannot be normalized for cosine. L2 normalization differs from LayerNorm, softmax and attention scaling. Standard attention uses scaled dot products, not necessarily cosine similarity.</p>`,
`<div class="eyebrow">04 • Shape reasoning</div><h1>Rows identify items. Columns hold features.</h1><div class="card"><label>Queries <input id="nq" type="number" min="1" max="1000" value="4" style="width:90px"></label><label>Keys <input id="nk" type="number" min="1" max="1000" value="6" style="width:90px"></label><label>Features <input id="nd" type="number" min="1" max="4096" value="8" style="width:100px"></label><div id="shapes"></div></div><div class="grid"><div class="card"><h2>Why transpose K?</h2><p>Keys are stored as rows. Matrix multiplication compares a left-hand row with a right-hand column.</p><p>K.T makes each key a column. No numbers are added or changed.</p></div><div class="card"><h2>Why do inner dimensions match?</h2><p>A dot product requires matching feature counts. Their products are summed into one score.</p><div class="formula">(m, d) @ (d, n) → (m, n)</div></div></div><div class="callout">For retrieval, items can be questions and chunks. For self-attention, Q and K come from the same token sequence, so their row counts match. The result has one score per query–key pair.</div><pre>scores = queries @ keys.T\n# @ = matrix multiplication\n# * = element-by-element multiplication</pre>`,
`<div class="eyebrow">05 • All pairwise comparisons</div><h1>Click a cell. See its dot product.</h1><p>Illustrative token positions: <strong>When | does | school | start</strong></p><div class="grid"><div class="card"><h2>Query and key rows</h2><table><tr><th>Token</th><th>Q</th><th>K</th></tr><tr><td>When</td><td>[2, 1]</td><td>[1, 0]</td></tr><tr><td>does</td><td>[0, 1]</td><td>[0, 1]</td></tr><tr><td>school</td><td>[1, 2]</td><td>[1, 1]</td></tr><tr><td>start</td><td>[2, 2]</td><td>[2, 1]</td></tr></table></div><div class="card"><h2>S = Q @ K.T</h2><div id="scoretable"></div><div id="cellcalc" aria-live="polite"></div><button id="nextcell">Next calculation</button></div></div><div class="callout">Each row belongs to a query position. Each column identifies a key position. S[i, j] = dot(Q[i], K[j]).</div><p class="note">These are raw, unmasked scores. In a causal decoder, comparisons with later positions are blocked before softmax. Attention matrices need not be symmetric.</p><details><summary>Python: explicit loops and matrix multiplication</summary><pre>scores = np.zeros((len(Q), len(K)))\nfor i in range(len(Q)):\n    for j in range(len(K)):\n        scores[i, j] = sum(\n            q * k for q, k in zip(Q[i], K[j])\n        )\n\n# Same calculations in one operation:\nscores = Q @ K.T</pre></details>`,
`<div class="eyebrow">06 • Learned transformations</div><h1>W_Q is a table of recipes</h1><p class="lead">Each column makes one query number from all the input features.</p><div class="grid"><div class="card"><h2>Input vector: edit the numbers</h2><div class="vector" id="xinputs"></div><table><tr><th>Input</th><th>Recipe 1</th><th>Recipe 2</th></tr><tr><td>a</td><td>× 1</td><td>× 0</td></tr><tr><td>b</td><td>× 0</td><td>× 1</td></tr><tr><td>c</td><td>× 1</td><td>× 1</td></tr></table><div id="qcalc"></div></div><div class="card"><h2>Why shape (3, 2)?</h2><p><strong>3 rows:</strong> each recipe needs weights for 3 input numbers.</p><p><strong>2 columns:</strong> we want 2 output query numbers.</p><div class="formula">[a, b, c] → [a+c, b+c]</div><p>The same recipes are applied to every token position. Training learns the weights; they stay fixed during ordinary inference.</p></div></div><div class="callout">School = [1, 2, 0] → Q = [1, 2]<br>starts = [0, 1, 3] → Q = [3, 4]</div><pre>X = np.array([[1, 2, 0], [0, 1, 3]], dtype=float)\nW_Q = np.array([[1, 0], [0, 1], [1, 1]], dtype=float)\nQ = X @ W_Q  # (2, 3) @ (3, 2) → (2, 2)</pre><p class="note">Three input features and two query features are chosen for easy arithmetic. They are not the model’s actual dimensions. Biases are omitted in this simplified example.</p>`,
`<div class="eyebrow">07 • Keys</div><h1>Separate recipes create keys</h1><div class="grid"><div class="card"><h2>W_K</h2><pre>[[0, 1],\n [1, 0],\n [1, 1]]</pre><div class="formula">[a, b, c] → [b+c, a+c]</div><p>School [1, 2, 0] → K [2, 1]<br>starts [0, 1, 3] → K [4, 3]</p></div><div class="card"><h2>Now compare Q with K</h2><table><tr><th>Query ↓ / Key →</th><th>School</th><th>starts</th></tr><tr><td>School [1, 2]</td><td>4</td><td>10</td></tr><tr><td>starts [3, 4]</td><td>10</td><td>24</td></tr></table><p>Bottom-left: [3, 4] · [2, 1]<br><strong>3×2 + 4×1 = 10</strong></p></div></div><div class="chips"><div><strong>Q</strong><br>Used to look for a match</div><div><strong>K</strong><br>Used to calculate that match</div><div><strong>Scores</strong><br>Numerical compatibility</div></div><pre>W_K = np.array([[0, 1], [1, 0], [1, 1]], dtype=float)\nK = X @ W_K\nscores = Q @ K.T\n# [[4, 10], [10, 24]]</pre><p class="note">Q and K are transformed from the same X using different learned parameters. These scores are not probabilities. This example happens to be symmetric; that is not a general property.</p>`,
`<div class="eyebrow">08 • Values</div><h1>Weights mix the value vectors</h1><div class="grid"><div class="card"><h2>Create V</h2><pre>W_V = [[1, 0],\n       [0, 1],\n       [2, 0]]</pre><div class="formula">[a, b, c] → [a+2c, b]</div><p>School [1, 2, 0] → V [1, 2]<br>starts [0, 1, 3] → V [6, 1]</p></div><div class="card"><h2>Output at “starts”</h2><label>Weight from School: <input id="mix" type="range" min="0" max="100" value="25"></label><div id="mixcalc" aria-live="polite"></div><p class="note">These weights are manually supplied—not derived from our scores. Scaling and softmax will be taught next.</p></div></div><div class="callout">Q and K determine attention weights. The weights determine how much of each V contributes to the output.</div><p>The output at “starts” draws information from both positions. It is an attention output vector; the surrounding transformer block further processes it.</p><pre>W_V = np.array([[1, 0], [0, 1], [2, 0]], dtype=float)\nV = X @ W_V\nweights = np.array([0.25, 0.75])\noutput = weights @ V  # [4.75, 1.25]</pre><p class="note">In a causal decoder, “starts” may draw from itself and the earlier “School” position. A V vector is numerical information, not a literal fact string.</p>`,
`<div class="eyebrow">09 • Context</div><h1>Retrieval finds text. Attention mixes information.</h1><div class="card"><table><tr><th></th><th>RAG retrieval</th><th>Attention inside the model</th></tr><tr><td>Compares</td><td>Question embedding vs chunk embeddings</td><td>Token queries vs token keys</td></tr><tr><td>Produces</td><td>Ranked, relevant chunks</td><td>Weights and combinations of values</td></tr><tr><td>School example</td><td>Finds “Classes begin at 8:30 AM”</td><td>Processes the question and supplied timing text</td></tr></table></div><div class="grid"><div class="card"><h2>Facts come from the school</h2><p>School document → chunking → embeddings → retrieval → relevant text placed in the prompt.</p><p>The model generates an answer using the supplied context. Retrieval and attention do not guarantee factual correctness; citations and evaluation still matter.</p></div><div class="card"><h2>Context changes a representation</h2><p>“School <strong>starts</strong> at 8:30 AM.”</p><p>“Fee collection <strong>starts</strong> on Monday.”</p><p>Attention helps create different contextual representations even though the word “starts” appears in both.</p></div></div><div class="callout">Matrices do not understand or permanently remember the school. They organize calculations. Positional information, learned weights, attention and other model layers work together.</div><details><summary>What comes next?</summary><p>Scale scores by √d_k → apply masks where needed → softmax → multiply weights by V. Then multi-head attention and the surrounding transformer block.</p><p>In causal attention, a token cannot look at future tokens in the same sequence. Later positions can combine earlier information across layers.</p></details>`,
`<div class="eyebrow">10 • Team checkpoint</div><h1>Explain it before moving forward</h1><p>Choose an answer for each question. Feedback appears after selection.</p><div id="quiz"></div><button id="resetquiz">Reset answers</button><details><summary>Instructor discussion prompts</summary><ol><li>Why does normalization remove length differences?</li><li>Why does K.T place keys in columns?</li><li>Explain each row and column in W_Q.</li><li>Why do Q, K and V use different learned recipes?</li><li>Where does the fact “8:30 AM” enter the RAG system?</li></ol></details>`
];
let page=0;const $=id=>document.getElementById(id);const fmt=n=>Number(n.toFixed(4)).toString();const vec=v=>'['+v.map(fmt).join(', ')+']';const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);const norm=a=>Math.sqrt(dot(a,a));
function inputVector(id,values,callback){$(id).innerHTML=values.map((x,i)=>`<input type="number" step="any" value="${x}" aria-label="${id} feature ${i+1}">`).join('');$(id).querySelectorAll('input').forEach(e=>e.oninput=callback)}
const getVec=id=>Array.from($(id).querySelectorAll('input')).map(e=>Number(e.value));
function show(n){page=Math.max(0,Math.min(titles.length-1,n));$('main').innerHTML=`<section class="slide">${slides[page]}</section><div class="pager"><button id="prev" ${page===0?'disabled':''}>← Previous</button><span>Lesson ${page+1} of ${titles.length} • ← / → to navigate</span><button id="next" ${page===titles.length-1?'disabled':''}>Next →</button></div><footer>School Attention Workshop • Offline teaching artifact • All toy vectors are illustrative.</footer>`;$('nav').innerHTML=titles.map((t,i)=>`<button data-page="${i}" class="${i===page?'active':''}" ${i===page?'aria-current="step"':''}>${i+1}. ${t}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>show(Number(b.dataset.page)));$('prev').onclick=()=>show(page-1);$('next').onclick=()=>show(page+1);init();window.scrollTo(0,0)}
function init(){
if(page===1){const update=()=>{const d=Number($('model').value);$('emb').innerHTML=`<p>Each chunk → <strong>${d} numbers</strong></p><p>3 chunks → embedding matrix <strong>(3, ${d})</strong></p><p>Parent question → <strong>(${d},)</strong></p><p>Database column → <strong>vector(${d})</strong></p><p>Each chunk remains a separate database row.</p>`};$('model').onchange=update;update()}
if(page===2){const update=()=>{const a=getVec('avec'),b=getVec('bvec');$('dot').innerHTML=`<p>${a.map((x,i)=>`${fmt(x)} × ${fmt(b[i])}`).join(' + ')}</p><p class="result">Dot product = ${fmt(dot(a,b))}</p>`};inputVector('avec',[2,1,3],update);inputVector('bvec',[1,4,2],update);update()}
if(page===3){const update=()=>{const s=Number($('scale').value),a=[1,1],base=$('direction').value==='same'?[1,1]:$('direction').value==='partial'?[1,0]:[-1,-1],b=base.map(x=>x*s),na=a.map(x=>x/norm(a)),nb=b.map(x=>x/norm(b));$('cos').innerHTML=`<div class="chips"><div>A = ${vec(a)}<br>B = ${vec(b)}</div><div>Raw dot product<br><strong>${fmt(dot(a,b))}</strong></div><div>Cosine similarity<br><strong>${fmt(dot(na,nb))}</strong></div></div><p>Normalized A = ${vec(na)}; normalized B = ${vec(nb)}</p><p>‖A‖ = ${fmt(norm(a))}; ‖B‖ = ${fmt(norm(b))}</p>`};$('scale').oninput=update;$('direction').onchange=update;update()}
if(page===4){const update=()=>{const m=Number($('nq').value),n=Number($('nk').value),d=Number($('nd').value);if(![m,n,d].every(x=>Number.isInteger(x)&&x>0)){ $('shapes').textContent='Enter positive whole numbers.';return} $('shapes').innerHTML=`<p class="formula">Q (${m}, ${d}) @ K.T (${d}, ${n}) → S (${m}, ${n})</p><p>K starts as (${n}, ${d}). Transpose swaps its axes.</p><p class="result">${m*n} comparison scores</p><p>Each score sums ${d} matching feature products.</p>`};['nq','nk','nd'].forEach(id=>$(id).oninput=update);update()}
if(page===5){const q=[[2,1],[0,1],[1,2],[2,2]],k=[[1,0],[0,1],[1,1],[2,1]],t=['When','does','school','start'];$('scoretable').innerHTML='<table><tr><th>Q ↓ / K →</th>'+t.map(x=>`<th>${x}</th>`).join('')+'</tr>'+q.map((v,i)=>`<tr><th>${t[i]}</th>`+k.map((w,j)=>`<td><button class="scorecell" data-i="${i}" data-j="${j}" aria-label="Query ${t[i]}, key ${t[j]}, score ${dot(v,w)}">${dot(v,w)}</button></td>`).join('')+'</tr>').join('')+'</table>';let current=0;const select=(i,j)=>{current=i*4+j;document.querySelectorAll('.scorecell').forEach(b=>b.classList.toggle('selected',Number(b.dataset.i)===i&&Number(b.dataset.j)===j));$('cellcalc').innerHTML=`<p><strong>Query “${t[i]}” → Key “${t[j]}”</strong></p><p>${vec(q[i])} · ${vec(k[j])}</p><p class="formula">${q[i][0]}×${k[j][0]} + ${q[i][1]}×${k[j][1]} = ${dot(q[i],k[j])}</p><p class="note">Stored at scores[${i}, ${j}] (zero-based indexes).</p>`};document.querySelectorAll('.scorecell').forEach(b=>b.onclick=()=>select(Number(b.dataset.i),Number(b.dataset.j)));$('nextcell').onclick=()=>{const n=(current+1)%16;select(Math.floor(n/4),n%4)};select(0,0)}
if(page===6){const update=()=>{const [a,b,c]=getVec('xinputs');$('qcalc').innerHTML=`<p>Recipe 1: ${a}×1 + ${b}×0 + ${c}×1 = <strong>${fmt(a+c)}</strong></p><p>Recipe 2: ${a}×0 + ${b}×1 + ${c}×1 = <strong>${fmt(b+c)}</strong></p><p class="result">Q = ${vec([a+c,b+c])}</p>`};inputVector('xinputs',[1,2,0],update);update()}
if(page===8){const update=()=>{const w=Number($('mix').value)/100,z=1-w,o=[w+6*z,2*w+z];$('mixcalc').innerHTML=`<p>School weight = ${fmt(w)}<br>starts weight = ${fmt(z)}<br>Total = 1</p><p>${fmt(w)} × [1, 2] + ${fmt(z)} × [6, 1]</p><p>Feature 1: ${fmt(w)}×1 + ${fmt(z)}×6 = ${fmt(o[0])}<br>Feature 2: ${fmt(w)}×2 + ${fmt(z)}×1 = ${fmt(o[1])}</p><p class="result">Output = ${vec(o)}</p>`};$('mix').oninput=update;update()}
if(page===10){const questions=[['What is [2, 3] · [4, 1]?',['7','11','14','21'],1,'2×4 + 3×1 = 11.'],['2 questions and 7 chunks, each with 384 features: score shape?',['(2, 384)','(384, 7)','(2, 7)','(7, 2)'],2,'(2,384) @ (384,7) produces (2,7): one score per question–chunk pair.'],['3 input features → 4 query features: W_Q shape?',['(3, 4)','(4, 3)','(3, 3)','(4, 4)'],0,'Three rows for input features; four recipe columns for query output features.'],['What does normalization preserve?',['Original magnitude','Number of words','Original direction','Original dot product'],2,'Dividing by a positive magnitude preserves direction and makes length 1.'],['A longer chunk encoded by all-MiniLM-L6-v2 produces…',['More than 384 dimensions','384 dimensions','One dimension per word','768 dimensions'],1,'Output dimension is fixed by the model, not chunk length. Input limits still apply.'],['What does V supply in attention?',['The raw comparison scores','The database schema','The tokenizer vocabulary','Information to combine using weights'],3,'Q and K determine weights; weighted combinations use V.'],['0.5×[1,2] + 0.5×[6,1] equals…',['[7,3]','[3.5,1.5]','[3,1]','[0.5,0.5]'],1,'Each feature is averaged: (1+6)/2 = 3.5 and (2+1)/2 = 1.5.'],['Where does the school timing fact enter this RAG example?',['In the retrieved school text','In W_Q as a date field','In the score matrix as text','In the vector column size'],0,'The retrieved source provides the fact; attention helps process the supplied context.']];$('quiz').innerHTML=questions.map((q,i)=>`<div class="question"><strong>${i+1}. ${q[0]}</strong>${q[1].map((a,j)=>`<button data-question="${i}" data-answer="${j}">${'ABCD'[j]}. ${a}</button>`).join('')}<p class="feedback" id="feedback${i}" aria-live="polite"></p></div>`).join('');$('quiz').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.question),j=Number(b.dataset.answer),q=questions[i];$('feedback'+i).textContent=(j===q[2]?'Correct. ':'Try again. ')+q[3]});$('resetquiz').onclick=()=>init()}
}
$('present').onclick=()=>{document.body.classList.toggle('present');$('present').textContent=document.body.classList.contains('present')?'Exit presentation':'Presentation mode'};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('Fullscreen is unavailable here. Open the downloaded file in your browser or use F11.')}};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();show(page+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(page-1)}});show(0);
</script></body></html>
